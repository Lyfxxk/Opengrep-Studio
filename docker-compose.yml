# Opengrep Studio —— 可选的 compose 启动方式（等价于 docker run，带命名数据卷）
# 启动：docker compose up -d   停止：docker compose down
# 未设 restart 策略：容器退出后不自动拉起（本地工具，崩了希望人先看到原因）
services:
  studio:
    build: .
    image: opengrep-studio
    ports:
      # 只发布到宿主机回环：本服务无鉴权，不能把无鉴权 API 暴露给局域网（需要时再自行放开并自担风险）
      - "127.0.0.1:8787:8787"
    volumes:
      # 数据卷：SQLite + 源码快照 + 自定义规则包，重建容器不丢失
      # 引擎不在此卷：容器内"一键升级"写在容器可写层（/app/opengrep-tool），重建容器即丢失并
      # 回落到镜像烧入的 engines.json 钉住版本；长期换引擎版本请改 engines.json 后重建镜像
      - ogstudio-data:/data
volumes:
  ogstudio-data:
