<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Opengrep Studio</title>
    <script>
      try {
        var mode = localStorage.getItem('__global_opengrep_theme');
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
        var lang = localStorage.getItem('__global_opengrep_lang');
        if (
          lang === 'en' ||
          lang === 'zh-Hant' ||
          lang === 'zh' ||
          lang === 'ja' ||
          lang === 'ko' ||
          lang === 'ru' ||
          lang === 'fr' ||
          lang === 'de'
        ) {
          document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
        }
        var skin = localStorage.getItem('__global_opengrep_skin');
        if (skin === 'default' || skin === 'graphite') {
          if (skin === 'default') {
            delete document.documentElement.dataset.skin;
          } else {
            document.documentElement.dataset.skin = skin;
          }
        }
      } catch (e) {
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
