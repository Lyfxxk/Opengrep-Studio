name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同一 ref（main 推送 / 同一 PR）只保留最新一次运行，过时的中途取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端（typecheck + 单测）· ${{ matrix.os }} · Node ${{ matrix.node-version }}
    strategy:
      # Windows 失败时不连坐 ubuntu，平台差异按平台单独看日志
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 22 = 支持下限线（最新补丁 ≥22.12；开发机已不再装 22，这条线只能靠 CI 守住）
        # 26 = 本地日常线，防止「本机过、CI 不过」的版本漂移
        node-version: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖
        run: npm --prefix server ci
      - name: 类型检查
        run: npm --prefix server run typecheck
      - name: 单元测试
        run: npm --prefix server test
      - name: i18n 资源一致性（三份 UI 语言包 + 简繁规则说明）
        run: npm --prefix server run i18n:check
      - name: 规则包回归（结构校验 + 随包样本回归）
        run: npm run test-packs

  frontend:
    name: 前端（lint + 构建）· ${{ matrix.os }} · Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # Vite 8 / rolldown 的 engines 是 ^20.19.0 || >=22.12.0，22 这条线是前端能装上的最低支持线
        node-version: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖
        run: npm --prefix code ci
      - name: 类型检查 + ESLint
        run: npm --prefix code run lint
      - name: 构建
        run: npm --prefix code run build

  e2e:
    name: 后端 E2E（真实引擎扫描）
    # 真实引擎 E2E 只在 ubuntu 跑：Windows 上下载引擎 + 扫描成本高，单测矩阵已覆盖平台盲区
    # 版本留在 22（支持下限线，与 Dockerfile 的 node:22 基础镜像一致）：开发机已切到 26，
    # 这里是唯一能验证「下限线上真实扫描 + 实验性 node:sqlite」的岗位，26 线由上面两个矩阵守住
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm --prefix server ci
      - name: 下载扫描引擎（SHA256 校验）
        run: npm run setup:engine
      - name: 启动后端
        run: |
          npm --prefix server run start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
              echo "后端已就绪"; exit 0
            fi
            sleep 2
          done
          echo "后端启动超时"; exit 1
      - name: E2E 回归
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
        env:
          # 显式走 IPv4 回环，避免 CI 环境 localhost 先解析到 ::1 造成偶发拒连（服务端只绑 127.0.0.1）
          BASE_URL: http://127.0.0.1:8787
      - name: 上传 E2E 日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
          retention-days: 7

  docker:
    name: Docker（构建 + 启动冒烟）
    # 镜像内会重新构建前后端，基础检查没过就不必烧 Docker 构建时长
    needs: [server, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（构建期内自动下载并校验引擎）
        run: docker build -t opengrep-studio:ci .
      - name: 启动冒烟（容器内探活 /api/health）
        # 防"构建成功但启动即失败"复发（如 docker-entrypoint.sh 缺执行位，见 410d46d）：
        # 起容器轮询健康检查，起不来就打印容器日志并失败
        run: |
          docker run -d --name smoke -p 127.0.0.1:8787:8787 opengrep-studio:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
              echo "容器启动冒烟通过"
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "容器启动冒烟失败，容器日志："
          docker logs smoke || true
          docker rm -f smoke > /dev/null 2>&1 || true
          exit 1
