name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: 后端（typecheck + 单测）· ${{ matrix.os }} · Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖
        run: npm --prefix server ci
      - name: 类型检查
        run: npm --prefix server run typecheck
      - name: 单元测试
        run: npm --prefix server test
      - name: i18n 资源一致性（三份 UI 语言包 + 简繁规则说明）
        run: npm --prefix server run i18n:check
      - name: 规则包回归（结构校验 + 随包样本回归）
        run: npm run test-packs

  frontend:
    name: 前端（lint + 构建）· ${{ matrix.os }} · Node ${{ matrix.node-version }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: ['22', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖
        run: npm --prefix code ci
      - name: 类型检查 + ESLint
        run: npm --prefix code run lint
      - name: 构建
        run: npm --prefix code run build

  e2e:
    name: E2E（真实引擎 + 浏览器端）
    runs-on: ubuntu-latest
    needs: [server]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 安装依赖
        run: npm --prefix server ci
      - name: 下载扫描引擎（SHA256 校验）
        run: npm run setup:engine
      - name: 启动后端
        run: |
          npm --prefix server run start &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
              echo "后端已就绪"; exit 0
            fi
            sleep 2
          done
          echo "后端启动超时"; exit 1
      - name: E2E 回归
        run: |
          set -o pipefail
          npm run e2e 2>&1 | tee e2e.log
        env:
          BASE_URL: http://127.0.0.1:8787
      - name: 上传 E2E 日志（排查用）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-log
          path: e2e.log
          retention-days: 7
      - name: 安装前端依赖
        run: npm --prefix code ci
      - name: 缓存 Playwright 浏览器
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('code/package-lock.json') }}
      - name: 安装 Playwright Chromium
        run: npm --prefix code run e2e:install
      - name: 浏览器端 E2E
        run: npm --prefix code run e2e:ui
      - name: 上传浏览器端 E2E 报告（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: code/e2e/.tmp/report
          retention-days: 7

  docker:
    name: Docker（构建 + 启动冒烟）
    needs: [server, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 构建镜像（构建期内自动下载并校验引擎）
        run: docker build -t opengrep-studio:ci .
      - name: 启动冒烟（容器内探活 /api/health）
        run: |
          docker run -d --name smoke -p 127.0.0.1:8787:8787 opengrep-studio:ci
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8787/api/health > /dev/null; then
              echo "容器启动冒烟通过"
              docker rm -f smoke > /dev/null
              exit 0
            fi
            sleep 2
          done
          echo "容器启动冒烟失败，容器日志："
          docker logs smoke || true
          docker rm -f smoke > /dev/null 2>&1 || true
          exit 1
