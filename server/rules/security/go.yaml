# Opengrep Studio 内置安全规则包（security）
# 来源: https://github.com/opengrep/opengrep-rules （精选子集）
# 许可: LGPL 2.1 + Commons Clause（不得将规则单独出售；保留本出处声明）
# 精选标准: 含 CWE/OWASP 安全元数据的一档优先、全量收录（ERROR 优先排序），剔除 correctness 目录
# 校验: opengrep validate --config server/rules/security
rules:
- id: go.dangerous-command-write
  patterns:
  - pattern: '$CW.Write($BYTE)

      '
  - pattern-inside: '$CW,$ERR := $CMD.StdinPipe()

      ...

      '
  - pattern-not: '$CW.Write("...")

      '
  - pattern-not: '$CW.Write([]byte("..."))

      '
  - pattern-not: '$CW.Write([]byte("..."+"..."))

      '
  - pattern-not-inside: '$BYTE = []byte("...");

      ...

      '
  - pattern-not-inside: '$BYTE = []byte("..."+"...");

      ...

      '
  - pattern-inside: 'import "os/exec"

      ...

      '
  message: Detected non-static command inside Write. Audit the input to '$CW.Write'. If unverified user data can reach this call site, this is a code injection vulnerability. A malicious actor can inject a malicious script to execute arbitrary code.
  severity: ERROR
  languages:
  - go
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    category: security
    technology:
    - go
    confidence: LOW
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/audit/dangerous-command-write.yaml
      upstream-id: dangerous-command-write
- id: go.dangerous-exec-cmd
  patterns:
  - pattern-either:
    - patterns:
      - pattern: 'exec.Cmd {...,Path: $CMD,...}

          '
      - pattern-not: 'exec.Cmd {...,Path: "...",...}

          '
      - pattern-not-inside: '$CMD,$ERR := exec.LookPath("...");

          ...

          '
      - pattern-not-inside: '$CMD = "...";

          ...

          '
    - patterns:
      - pattern: 'exec.Cmd {...,Args: $ARGS,...}

          '
      - pattern-not: 'exec.Cmd {...,Args: []string{...},...}

          '
      - pattern-not-inside: '$ARGS = []string{"...",...};

          ...

          '
      - pattern-not-inside: '$CMD = "...";

          ...

          $ARGS = []string{$CMD,...};

          ...

          '
      - pattern-not-inside: '$CMD = exec.LookPath("...");

          ...

          $ARGS = []string{$CMD,...};

          ...

          '
    - patterns:
      - pattern: 'exec.Cmd {...,Args: []string{$CMD,...},...}

          '
      - pattern-not: 'exec.Cmd {...,Args: []string{"...",...},...}

          '
      - pattern-not-inside: '$CMD,$ERR := exec.LookPath("...");

          ...

          '
      - pattern-not-inside: '$CMD = "...";

          ...

          '
    - patterns:
      - pattern-either:
        - pattern: 'exec.Cmd {...,Args: []string{"=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$EXE,...},...}

            '
        - patterns:
          - pattern: 'exec.Cmd {...,Args: []string{$CMD,"-c",$EXE,...},...}

              '
          - pattern-inside: '$CMD,$ERR := exec.LookPath("=~/(sh|bash|ksh|csh|tcsh|zsh)/");

              ...

              '
      - pattern-not: 'exec.Cmd {...,Args: []string{"...","...","...",...},...}

          '
      - pattern-not-inside: '$EXE = "...";

          ...

          '
  - pattern-inside: 'import "os/exec"

      ...

      '
  message: Detected non-static command inside exec.Cmd. Audit the input to 'exec.Cmd'. If unverified user data can reach this call site, this is a code injection vulnerability. A malicious actor can inject a malicious script to execute arbitrary code.
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: MEDIUM
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/audit/dangerous-exec-cmd.yaml
      upstream-id: dangerous-exec-cmd
  severity: ERROR
  languages:
  - go
- id: go.dangerous-exec-command
  patterns:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern: 'exec.Command($CMD,...)

            '
        - pattern: 'exec.CommandContext($CTX,$CMD,...)

            '
      - pattern-not: 'exec.Command("...",...)

          '
      - pattern-not: 'exec.CommandContext($CTX,"...",...)

          '
    - patterns:
      - pattern-either:
        - pattern: 'exec.Command("=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)

            '
        - pattern: 'exec.CommandContext($CTX,"=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)

            '
      - pattern-not: 'exec.Command("...","...","...",...)

          '
      - pattern-not: 'exec.CommandContext($CTX,"...","...","...",...)

          '
    - pattern-either:
      - pattern: 'exec.Command("=~/\/bin\/env/","=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)

          '
      - pattern: 'exec.CommandContext($CTX,"=~/\/bin\/env/","=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$CMD,...)

          '
  - pattern-inside: 'import "os/exec"

      ...

      '
  - pattern-not-inside: '$CMD,$ERR := exec.LookPath("...");

      ...

      '
  - pattern-not-inside: '$CMD = "...";

      ...

      '
  message: Detected non-static command inside Command. Audit the input to 'exec.Command'. If unverified user data can reach this call site, this is a code injection vulnerability. A malicious actor can inject a malicious script to execute arbitrary code.
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/audit/dangerous-exec-command.yaml
      upstream-id: dangerous-exec-command
  severity: ERROR
  languages:
  - go
- id: go.dangerous-execution
  message: Detected non-static script inside otto VM. Audit the input to 'VM.Run'. If unverified user data can reach this call site, this is a code injection vulnerability. A malicious actor can inject a malicious script to execute arbitrary code.
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - otto
    - vm
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/otto/security/audit/dangerous-execution.yaml
      upstream-id: dangerous-execution
  severity: ERROR
  patterns:
  - pattern-inside: '$VM = otto.New(...)

      ...

      '
  - pattern-not: $VM.Run("...", ...)
  - pattern: $VM.Run(...)
  languages:
  - go
- id: go.dangerous-syscall-exec
  patterns:
  - pattern-either:
    - patterns:
      - pattern: 'syscall.$METHOD($BIN,...)

          '
      - pattern-not: 'syscall.$METHOD("...",...)

          '
      - pattern-not-inside: '$BIN,$ERR := exec.LookPath("...");

          ...

          '
      - pattern-not-inside: '$BIN = "...";

          ...

          '
    - patterns:
      - pattern: 'syscall.$METHOD($BIN,$ARGS,...)

          '
      - pattern-not: 'syscall.$METHOD($BIN,[]string{"...",...},...)

          '
      - pattern-not-inside: '$ARGS := []string{"...",...};

          ...

          '
      - pattern-not-inside: '$CMD = "...";

          ...

          $ARGS = []string{$CMD,...};

          ...

          '
      - pattern-not-inside: '$CMD,$ERR := exec.LookPath("...");

          ...

          $ARGS = []string{$CMD,...};

          ...

          '
    - patterns:
      - pattern: 'syscall.$METHOD($BIN,[]string{"=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$EXE,...},...)

          '
      - pattern-not: 'syscall.$METHOD($BIN,[]string{"...","...","...",...},...)

          '
    - patterns:
      - pattern: 'syscall.$METHOD($BIN,$ARGS,...)

          '
      - pattern-either:
        - pattern-inside: '$ARGS := []string{"=~/(sh|bash|ksh|csh|tcsh|zsh)/","-c",$EXE,...};

            ...

            '
        - pattern-inside: '$CMD = "=~/(sh|bash|ksh|csh|tcsh|zsh)/";

            ...

            $ARGS = []string{$CMD,"-c",$EXE,...};

            ...

            '
        - pattern-inside: '$CMD,$ERR := exec.LookPath("=~/(sh|bash|ksh|csh|tcsh|zsh)/");

            ...

            $ARGS = []string{$CMD,"-c",$EXE,...};

            ...

            '
      - pattern-not-inside: '$ARGS := []string{"...","...","...",...};

          ...

          '
      - pattern-not-inside: '$CMD = "...";

          ...

          $ARGS = []string{$CMD,"...","...",...};

          ...

          '
      - pattern-not-inside: '$CMD,$ERR := exec.LookPath("...");

          ...

          $ARGS = []string{$CMD,"...","...",...};

          ...

          '
  - pattern-inside: 'import "syscall"

      ...

      '
  - metavariable-regex:
      metavariable: $METHOD
      regex: (Exec|ForkExec)
  message: Detected non-static command inside Exec. Audit the input to 'syscall.Exec'. If unverified user data can reach this call site, this is a code injection vulnerability. A malicious actor can inject a malicious script to execute arbitrary code.
  metadata:
    cwe:
    - 'CWE-94: Improper Control of Generation of Code (''Code Injection'')'
    owasp:
    - A03:2021 - Injection
    category: security
    technology:
    - go
    confidence: LOW
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/audit/dangerous-syscall-exec.yaml
      upstream-id: dangerous-syscall-exec
  severity: ERROR
  languages:
  - go
- id: go.filepath-clean-misuse
  message: '`Clean` is not intended to sanitize against path traversal attacks. This function is for finding the shortest path name equivalent to the given input. Using `Clean` to sanitize file reads may expose this application to path traversal attacks, where an attacker could access arbitrary files on the server. To fix this easily, write this: `filepath.FromSlash(path.Clean("/"+strings.Trim(req.URL.Path, "/")))` However, a better solution is using the `SecureJoin` function in the package `filepath-securejoin`. See https://pkg.go.dev/github.com/cyphar/filepath-securejoin#section-readme.'
  severity: ERROR
  languages:
  - go
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-either:
      - pattern: '($REQUEST : *http.Request).$ANYTHING

          '
      - pattern: '($REQUEST : http.Request).$ANYTHING

          '
    - metavariable-regex:
        metavariable: $ANYTHING
        regex: ^(BasicAuth|Body|Cookie|Cookies|Form|FormValue|GetBody|Host|MultipartReader|ParseForm|ParseMultipartForm|PostForm|PostFormValue|Referer|RequestURI|Trailer|TransferEncoding|UserAgent|URL)$
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: filepath.Clean($...INNER)
      - pattern: path.Clean($...INNER)
  pattern-sanitizers:
  - pattern-either:
    - pattern: '"/" + ...

        '
  fix: filepath.FromSlash(filepath.Clean("/"+strings.Trim($...INNER, "/")))
  options:
    interfile: true
  metadata:
    references:
    - https://pkg.go.dev/path#Clean
    - http://technosophos.com/2016/03/31/go-quickly-cleaning-filepaths.html
    - https://labs.detectify.com/2021/12/15/zero-day-path-traversal-grafana/
    - https://dzx.cz/2021/04/02/go_path_traversal/
    - https://pkg.go.dev/github.com/cyphar/filepath-securejoin#section-readme
    cwe:
    - 'CWE-22: Improper Limitation of a Pathname to a Restricted Directory (''Path Traversal'')'
    owasp:
    - A05:2017 - Broken Access Control
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - go
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    interfile: true
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/filepath-clean-misuse.yaml
      upstream-id: filepath-clean-misuse
- id: go.go-ssti
  patterns:
  - pattern-inside: 'import ("html/template")

      ...

      '
  - pattern: $TEMPLATE = fmt.Sprintf("...", $ARG, ...)
  - patterns:
    - pattern-either:
      - pattern-inside: 'func $FN(..., $REQ *http.Request, ...){

          ...

          }

          '
      - pattern-inside: 'func $FN(..., $REQ http.Request, ...){

          ...

          }

          '
      - pattern-inside: 'func(..., $REQ *http.Request, ...){

          ...

          }

          '
  - patterns:
    - pattern-either:
      - pattern-inside: '$ARG := $REQ.URL.Query().Get(...)

          ...

          $T, $ERR := $TMPL.Parse($TEMPLATE)

          '
      - pattern-inside: '$ARG := $REQ.Form.Get(...)

          ...

          $T, $ERR := $TMPL.Parse($TEMPLATE)

          '
      - pattern-inside: '$ARG := $REQ.PostForm.Get(...)

          ...

          $T, $ERR := $TMPL.Parse($TEMPLATE)

          '
  message: A server-side template injection occurs when an attacker is able to use native template syntax to inject a malicious payload into a template, which is then executed server-side. When using "html/template" always check that user inputs are validated and sanitized before included within the template.
  languages:
  - go
  severity: ERROR
  metadata:
    category: security
    cwe:
    - 'CWE-1336: Improper Neutralization of Special Elements Used in a Template Engine'
    references:
    - https://www.onsecurity.io/blog/go-ssti-method-research/
    - http://blog.takemyhand.xyz/2020/05/ssti-breaking-gos-template-engine-to.html
    technology:
    - go
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/template/security/ssti.yaml
      upstream-id: go-ssti
- id: go.gosql-sqli
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $DB.$METHOD(...,$QUERY,...)
      - pattern-either:
        - pattern-inside: '$QUERY = $X + $Y

            ...

            '
        - pattern-inside: '$QUERY += $X

            ...

            '
        - pattern-inside: '$QUERY = fmt.Sprintf("...", $PARAM1, ...)

            ...

            '
      - pattern-not-inside: '$QUERY += "..."

          ...

          '
      - pattern-not-inside: '$QUERY = "..." + "..."

          ...

          '
    - pattern: $DB.$METHOD(..., $X + $Y, ...)
    - pattern: $DB.$METHOD(..., fmt.Sprintf("...", $PARAM1, ...), ...)
  - pattern-either:
    - pattern-inside: '$DB, ... = sql.Open(...)

        ...

        '
    - pattern-inside: "func $FUNCNAME(..., $DB *sql.DB, ...) {\n  ...\n}\n"
  - pattern-not: $DB.$METHOD(..., "..." + "...", ...)
  - metavariable-regex:
      metavariable: $METHOD
      regex: ^(Exec|ExecContent|Query|QueryContext|QueryRow|QueryRowContext)$
  languages:
  - go
  message: Detected string concatenation with a non-literal variable in a "database/sql" Go SQL statement. This could lead to SQL injection if the variable is user-controlled and not properly sanitized. In order to prevent SQL injection, use parameterized queries or prepared statements instead. You can use prepared statements with the 'Prepare' and 'PrepareContext' calls.
  metadata:
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    references:
    - https://golang.org/pkg/database/sql/
    category: security
    technology:
    - go
    confidence: LOW
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/lang/security/audit/sqli/gosql-sqli.yaml
      upstream-id: gosql-sqli
  severity: ERROR
- id: go.grpc-client-insecure-connection
  metadata:
    cwe:
    - 'CWE-300: Channel Accessible by Non-Endpoint'
    references:
    - https://blog.gopheracademy.com/advent-2019/go-grps-and-tls/#connection-without-encryption
    category: security
    technology:
    - grpc
    confidence: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/grpc/security/grpc-client-insecure-connection.yaml
      upstream-id: grpc-client-insecure-connection
  message: 'Found an insecure gRPC connection using ''grpc.WithInsecure()''. This creates a connection without encryption to a gRPC server. A malicious attacker could tamper with the gRPC message, which could compromise the machine. Instead, establish a secure connection with an SSL certificate using the ''grpc.WithTransportCredentials()'' function. You can create a create credentials using a ''tls.Config{}'' struct with ''credentials.NewTLS()''. The final fix looks like this: ''grpc.WithTransportCredentials(credentials.NewTLS(<config>))''.'
  languages:
  - go
  severity: ERROR
  pattern: $GRPC.Dial($ADDR, ..., $GRPC.WithInsecure(...), ...)
  fix-regex:
    regex: (.*)WithInsecure\(.*?\)
    replacement: \1WithTransportCredentials(credentials.NewTLS(<your_tls_config_here>))
- id: go.grpc-server-insecure-connection
  metadata:
    cwe:
    - 'CWE-300: Channel Accessible by Non-Endpoint'
    references:
    - https://blog.gopheracademy.com/advent-2019/go-grps-and-tls/#connection-without-encryption
    category: security
    technology:
    - grpc
    confidence: HIGH
    owasp:
    - A07:2021 - Identification and Authentication Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/grpc/security/grpc-server-insecure-connection.yaml
      upstream-id: grpc-server-insecure-connection
  message: Found an insecure gRPC server without 'grpc.Creds()' or options with credentials. This allows for a connection without encryption to this server. A malicious attacker could tamper with the gRPC message, which could compromise the machine. Include credentials derived from an SSL certificate in order to create a secure gRPC connection. You can create credentials using 'credentials.NewServerTLSFromFile("cert.pem", "cert.key")'.
  languages:
  - go
  severity: ERROR
  mode: taint
  pattern-sinks:
  - requires: OPTIONS and not CREDS
    pattern: grpc.NewServer($OPT, ...)
  - requires: EMPTY_CONSTRUCTOR
    pattern: grpc.NewServer()
  pattern-sources:
  - label: OPTIONS
    pattern: grpc.ServerOption{ ... }
  - label: CREDS
    pattern: grpc.Creds(...)
  - label: EMPTY_CONSTRUCTOR
    pattern: grpc.NewServer()
- id: go.jwt-go-none-algorithm
  message: Detected use of the 'none' algorithm in a JWT token. The 'none' algorithm assumes the integrity of the token has already been verified. This would allow a malicious actor to forge a JWT token that will automatically be verified. Do not explicitly use the 'none' algorithm. Instead, use an algorithm such as 'HS256'.
  metadata:
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    source-rule-url: https://semgrep.dev/blog/2020/hardcoded-secrets-unverified-tokens-and-other-common-jwt-mistakes/
    category: security
    technology:
    - jwt
    confidence: HIGH
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - audit
    likelihood: LOW
    impact: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: go/jwt-go/security/jwt-none-alg.yaml
      upstream-id: jwt-go-none-algorithm
  languages:
  - go
  severity: ERROR
  patterns:
  - pattern-either:
    - pattern-inside: 'import "github.com/golang-jwt/jwt"

        ...

        '
    - pattern-inside: 'import "github.com/dgrijalva/jwt-go"

        ...

        '
  - pattern-either:
    - pattern: 'jwt.SigningMethodNone

        '
    - pattern: jwt.UnsafeAllowNoneSignatureType
