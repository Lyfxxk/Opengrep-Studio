# Opengrep Studio 内置安全规则包（security）
# 来源: https://github.com/opengrep/opengrep-rules （精选子集）
# 许可: LGPL 2.1 + Commons Clause（不得将规则单独出售；保留本出处声明）
# 精选标准: 含安全元数据的优先、每语言 ≤ 50 条（官方不足 50 条时全量收录），剔除 correctness 目录
# 校验: opengrep validate --config server/rules/security
rules:
- id: js-ts.aead-no-final
  message: The 'final' call of a Decipher object checks the authentication tag in a mode for authenticated encryption. Failing to call 'final' will invalidate all integrity guarantees of the released ciphertext.
  metadata:
    cwe:
    - 'CWE-310: CWE CATEGORY: Cryptographic Issues'
    owasp:
    - A02:2021 - Cryptographic Failures
    category: security
    subcategory:
    - vuln
    technology:
    - node-crypto
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    references:
    - https://nodejs.org/api/crypto.html#deciphersetauthtagbuffer-encoding
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    opengrep-studio:
      source: opengrep-rules
      upstream-path: javascript/node-crypto/security/aead-no-final.yaml
      upstream-id: aead-no-final
  languages:
  - javascript
  - typescript
  severity: ERROR
  patterns:
  - pattern: '$DECIPHER = $CRYPTO.createDecipheriv(''$ALGO'', ...)

      ...

      $DECIPHER.update(...)

      '
  - pattern-not-inside: '$DECIPHER = $CRYPTO.createDecipheriv(''$ALGO'', ...)

      ...

      $DECIPHER.final(...)

      '
  - metavariable-regex:
      metavariable: $ALGO
      regex: .*(-gcm|-ccm|-ocb|chacha20-poly1305)$
- id: js-ts.awscdk-bucket-encryption
  message: 'Add "encryption: $Y.BucketEncryption.KMS_MANAGED" or "encryption: $Y.BucketEncryption.S3_MANAGED" to the bucket props for Bucket construct $X'
  metadata:
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    category: security
    technology:
    - AWS-CDK
    references:
    - https://docs.aws.amazon.com/AmazonS3/latest/userguide/security-best-practices.html
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    subcategory:
    - vuln
    likelihood: LOW
    impact: HIGH
    confidence: MEDIUM
    opengrep-studio:
      source: opengrep-rules
      upstream-path: typescript/aws-cdk/security/audit/awscdk-bucket-encryption.yml
      upstream-id: awscdk-bucket-encryption
  languages:
  - typescript
  severity: ERROR
  pattern-either:
  - patterns:
    - pattern-inside: 'import {Bucket} from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: const $X = new Bucket(...)
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.KMS_MANAGED, ...})

        '
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.KMS, ...})

        '
    - pattern-not: 'const $X = new Bucket(..., {..., encryption: BucketEncryption.S3_MANAGED, ...})

        '
  - patterns:
    - pattern-inside: 'import * as $Y from ''@aws-cdk/aws-s3''

        ...

        '
    - pattern: const $X = new $Y.Bucket(...)
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.KMS_MANAGED, ...})

        '
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.KMS, ...})

        '
    - pattern-not: 'const $X = new $Y.Bucket(..., {..., encryption: $Y.BucketEncryption.S3_MANAGED, ...})

        '
- id: js-ts.code-string-concat
  message: Found data from an Express or Next web request flowing to `eval`. If this data is user-controllable this can lead to execution of arbitrary system commands in the context of your application process. Avoid `eval` whenever possible.
  options:
    interfile: true
  metadata:
    interfile: true
    confidence: HIGH
    owasp:
    - A03:2021 - Injection
    cwe:
    - 'CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code (''Eval Injection'')'
    references:
    - https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/eval
    - https://nodejs.org/api/child_process.html#child_processexeccommand-options-callback
    - https://www.stackhawk.com/blog/nodejs-command-injection-examples-and-prevention/
    - https://ckarande.gitbooks.io/owasp-nodegoat-tutorial/content/tutorial/a1_-_server_side_js_injection.html
    category: security
    technology:
    - node.js
    - Express
    - Next.js
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    opengrep-studio:
      source: opengrep-rules
      upstream-path: javascript/lang/security/audit/code-string-concat.yaml
      upstream-id: code-string-concat
  languages:
  - javascript
  - typescript
  severity: ERROR
  mode: taint
  pattern-sources:
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: function ... ($REQ, $RES) {...}
        - pattern-inside: function ... ($REQ, $RES, $NEXT) {...}
        - patterns:
          - pattern-either:
            - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES) {...})
            - pattern-inside: $APP.$METHOD(..., function $FUNC($REQ, $RES, $NEXT) {...})
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(get|post|put|head|delete|options)$
      - pattern-either:
        - pattern: $REQ.query
        - pattern: $REQ.body
        - pattern: $REQ.params
        - pattern: $REQ.cookies
        - pattern: $REQ.headers
    - patterns:
      - pattern-either:
        - pattern-inside: 'import { ...,$IMPORT,... } from ''next/router''

            ...

            '
        - pattern-inside: 'import $IMPORT from ''next/router'';

            ...

            '
      - pattern-either:
        - patterns:
          - pattern-inside: '$ROUTER = $IMPORT()

              ...

              '
          - pattern-either:
            - pattern-inside: 'const { ...,$PROPS,... } = $ROUTER.query

                ...

                '
            - pattern-inside: 'var { ...,$PROPS,... } = $ROUTER.query

                ...

                '
            - pattern-inside: 'let { ...,$PROPS,... } = $ROUTER.query

                ...

                '
          - focus-metavariable: $PROPS
        - patterns:
          - pattern-inside: '$ROUTER = $IMPORT()

              ...

              '
          - pattern: "$ROUTER.query.$VALUE \n"
        - patterns:
          - pattern: $IMPORT().query.$VALUE
  pattern-sinks:
  - patterns:
    - pattern: 'eval(...)

        '
- id: js-ts.create-de-cipher-no-iv
  message: The deprecated functions 'createCipher' and 'createDecipher' generate the same initialization vector every time. For counter modes such as CTR, GCM, or CCM this leads to break of both confidentiality and integrity, if the key is used more than once. Other modes are still affected in their strength, though they're not completely broken. Use 'createCipheriv' or 'createDecipheriv' instead.
  metadata:
    cwe:
    - 'CWE-1204: Generation of Weak Initialization Vector (IV)'
    category: security
    subcategory:
    - vuln
    technology:
    - node-crypto
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    references:
    - https://nodejs.org/api/crypto.html#cryptocreatecipheralgorithm-password-options
    - https://nodejs.org/api/crypto.html#cryptocreatedecipheralgorithm-password-options
    opengrep-studio:
      source: opengrep-rules
      upstream-path: javascript/node-crypto/security/create-de-cipher-no-iv.yaml
      upstream-id: create-de-cipher-no-iv
  languages:
  - javascript
  - typescript
  severity: ERROR
  patterns:
  - pattern-either:
    - pattern: '$CRYPTO.createCipher(...)

        '
    - pattern: '$CRYPTO.createDecipher(...)

        '
- id: js-ts.dangerous-spawn-shell
  message: Detected non-literal calls to $EXEC(). This could lead to a command injection vulnerability.
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    source-rule-url: https://github.com/nodesecurity/eslint-plugin-security/blob/master/rules/detect-child-process.js
    category: security
    technology:
    - javascript
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Nodejs_Security_Cheat_Sheet.html#do-not-use-dangerous-functions
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: javascript/lang/security/audit/dangerous-spawn-shell.yaml
      upstream-id: dangerous-spawn-shell
  languages:
  - javascript
  - typescript
  severity: ERROR
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: "function ... (...,$FUNC,...) {\n  ...\n}\n"
    - focus-metavariable: $FUNC
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern-inside: 'require(''child_process'')

          ...

          '
      - pattern-inside: 'import ''child_process''

          ...

          '
    - pattern-either:
      - pattern: spawn(...)
      - pattern: spawnSync(...)
      - pattern: $CP.spawn(...)
      - pattern: $CP.spawnSync(...)
    - pattern-either:
      - pattern: '$EXEC("=~/(sh|bash|ksh|csh|tcsh|zsh)/",["-c", $ARG, ...],...)

          '
      - patterns:
        - pattern: $EXEC($CMD,["-c", $ARG, ...],...)
        - pattern-inside: '$CMD = "=~/(sh|bash|ksh|csh|tcsh|zsh)/"

            ...

            '
      - pattern: '$EXEC("=~/(sh|bash|ksh|csh|tcsh|zsh)/",[$ARG, ...],...)

          '
      - patterns:
        - pattern: $EXEC($CMD,[$ARG, ...],...)
        - pattern-inside: '$CMD = "=~/(sh|bash|ksh|csh|tcsh|zsh)/"

            ...

            '
    - focus-metavariable: $ARG
