# Opengrep Studio 内置安全规则包（security）
# 来源: https://github.com/opengrep/opengrep-rules （精选子集）
# 许可: LGPL 2.1 + Commons Clause（不得将规则单独出售；保留本出处声明）
# 精选标准: 含 CWE/OWASP 安全元数据的一档优先、全量收录（ERROR 优先排序），剔除 correctness 目录
# 校验: opengrep validate server/rules/security
rules:
- id: csharp.csharp-sqli
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: '(string $X)

        '
    - pattern-not: '"..."

        '
  pattern-propagators:
  - pattern: (StringBuilder $B).$ANY(...,(string $X),...)
    from: $X
    to: $B
  pattern-sinks:
  - patterns:
    - pattern-either:
      - patterns:
        - pattern: 'new $PATTERN($CMD,...)

            '
        - focus-metavariable: $CMD
      - patterns:
        - pattern: '$CMD.$PATTERN = $VALUE;

            '
        - focus-metavariable: $VALUE
    - metavariable-regex:
        metavariable: $PATTERN
        regex: ^(SqlCommand|CommandText|OleDbCommand|OdbcCommand|OracleCommand)$
  pattern-sanitizers:
  - pattern-either:
    - pattern: '$CMD.Parameters.add(...)

        '
    - pattern: '$CMD.Parameters[$IDX] = ...

        '
    by-side-effect: true
  message: Detected a formatted string in a SQL statement. This could lead to SQL injection if variables in the SQL statement are not properly sanitized. Use a prepared statements instead. You can obtain a PreparedStatement using 'SqlCommand' and 'SqlParameter'.
  metadata:
    category: security
    technology:
    - csharp
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    cwe:
    - 'CWE-89: Improper Neutralization of Special Elements used in an SQL Command (''SQL Injection'')'
    confidence: MEDIUM
    references:
    - https://owasp.org/Top10/A03_2021-Injection
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/sqli/csharp-sqli.yaml
      upstream-id: csharp-sqli
  languages:
  - csharp
  severity: ERROR
- id: csharp.ldap-injection
  message: LDAP queries are constructed dynamically on user-controlled input. This vulnerability in code could lead to an arbitrary LDAP query execution.
  severity: ERROR
  metadata:
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    category: security
    cwe:
    - 'CWE-90: Improper Neutralization of Special Elements used in an LDAP Query (''LDAP Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://owasp.org/Top10/A03_2021-Injection/
    - https://cwe.mitre.org/data/definitions/90
    - https://cheatsheetseries.owasp.org/cheatsheets/LDAP_Injection_Prevention_Cheat_Sheet.html#safe-c-sharp-net-tba-example
    subcategory:
    - vuln
    technology:
    - .net
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/dotnet/security/audit/ldap-injection.yaml
      upstream-id: ldap-injection
  languages:
  - csharp
  mode: taint
  options:
    taint_unify_mvars: true
  pattern-sources:
  - patterns:
    - focus-metavariable: $INPUT
    - pattern-inside: $T $M($INPUT,...) {...}
  pattern-sinks:
  - patterns:
    - pattern-either:
      - pattern: $S.Filter = ... + $INPUT + ...
      - pattern: $S.Filter = String.Format(...,$INPUT)
      - pattern: $S.Filter = String.Concat(...,$INPUT)
  pattern-sanitizers:
  - pattern-either:
    - pattern: Regex.Replace($INPUT, ...)
    - pattern: $ENCODER.LdapFilterEncode($INPUT)
    - pattern: $ENCODER.LdapDistinguishedNameEncode($INPUT)
- id: csharp.open-redirect
  mode: taint
  pattern-sources:
  - patterns:
    - focus-metavariable: $PARAM
    - pattern-inside: "public $TYPE $FUNCNAME (..., string $PARAM, ...) {\n  ...\n}\n"
  pattern-sinks:
  - patterns:
    - pattern: Redirect(...)
    - pattern-not-inside: "if (IsLocalUrl(...)) { \n    ... \n    Redirect(...); \n    ...\n}\n"
    - pattern-not-inside: "if ($URL.IsLocalUrl(...)) { \n    ... \n    Redirect(...); \n    ...\n}\n"
  message: A query string parameter may contain a URL value that could cause the web application to redirect the request to a malicious website controlled by an attacker. Make sure to sanitize this parameter sufficiently.
  metadata:
    category: security
    technology:
    - csharp
    cwe:
    - 'CWE-601: URL Redirection to Untrusted Site (''Open Redirect'')'
    references:
    - https://cwe.mitre.org/data/definitions/601.html
    owasp:
    - A01:2021 - Broken Access Control
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/open-redirect.yaml
      upstream-id: open-redirect
  languages:
  - csharp
  severity: ERROR
- id: csharp.os-command-injection
  severity: ERROR
  languages:
  - csharp
  metadata:
    cwe:
    - 'CWE-78: Improper Neutralization of Special Elements used in an OS Command (''OS Command Injection'')'
    owasp:
    - A01:2017 - Injection
    - A03:2021 - Injection
    references:
    - https://owasp.org/www-community/attacks/Command_Injection
    category: security
    technology:
    - .net
    confidence: LOW
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/injections/os-command.yaml
      upstream-id: os-command-injection
  message: The software constructs all or part of an OS command using externally-influenced input from an upstream component, but it does not neutralize or incorrectly neutralizes special elements that could modify the intended OS command when it is sent to a downstream component.
  patterns:
  - pattern-inside: 'using System.Diagnostics;

      ...

      '
  - pattern-inside: "public $T $F(..., $ARG, ...)\n{\n  ...\n}\n"
  - pattern-either:
    - patterns:
      - pattern: 'Process.Start($ARG, ...);

          '
      - focus-metavariable: $ARG
    - patterns:
      - pattern-inside: 'Process $PROC = new Process();

          ...

          '
      - pattern-either:
        - pattern-inside: '$PROC.StartInfo.FileName = $ARG;

            ...

            '
        - pattern-inside: '$PROC.StartInfo.Arguments = <... $ARG ...>;

            ...

            '
      - pattern: '$PROC.Start();

          '
    - patterns:
      - patterns:
        - pattern-inside: "ProcessStartInfo $PSINFO = new ProcessStartInfo()\n{\n  ...\n};\n...\n"
        - pattern-either:
          - pattern-inside: 'FileName = $ARG;

              ...

              '
          - pattern-inside: 'Arguments = <... $ARG ...>;

              ...

              '
      - pattern: 'Process.Start($PSINFO);

          '
      - focus-metavariable: $PSINFO
    - patterns:
      - pattern-inside: "Process $PROC = new Process()\n{\n  StartInfo = new ProcessStartInfo()\n  {\n    ...\n  }\n};\n...\n"
      - pattern-either:
        - pattern-inside: 'FileName = $ARG;

            ...

            '
        - pattern-inside: 'Arguments = $ARG;

            ...

            '
      - pattern: '$PROC.Start();

          '
- id: csharp.ssrf
  severity: ERROR
  languages:
  - csharp
  metadata:
    cwe:
    - 'CWE-918: Server-Side Request Forgery (SSRF)'
    owasp:
    - A10:2021 - Server-Side Request Forgery (SSRF)
    references:
    - https://cheatsheetseries.owasp.org/cheatsheets/Server_Side_Request_Forgery_Prevention_Cheat_Sheet.html
    category: security
    technology:
    - .net
    confidence: LOW
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: MEDIUM
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/ssrf/http-client.yaml
      upstream-id: ssrf
  message: SSRF is an attack vector that abuses an application to interact with the internal/external network or the machine itself.
  patterns:
  - pattern-inside: 'using System.Net.Http;

      ...

      '
  - pattern-either:
    - pattern: '$T $F(..., $X, ...)

        {

        ...

        HttpClient $Y = new HttpClient();

        ...

        ... $Y.GetAsync(<... $X ...>, ...);

        }

        '
    - pattern: '$T $F(..., $X, ...)

        {

        ...

        $A $B = <... $X ...>;

        ...

        HttpClient $Y = new HttpClient();

        ...

        ... $Y.GetAsync($B, ...);

        }

        '
    - pattern: '$T $F(..., $X, ...)

        {

        ...

        HttpClient $Y = new HttpClient();

        ...

        ... $Y.GetStringAsync(<... $X ...>);

        }

        '
    - pattern: '$T $F(..., $X, ...)

        {

        ...

        $A $B = <... $X ...>;

        ...

        HttpClient $Y = new HttpClient();

        ...

        ... $Y.GetStringAsync($B);

        }

        '
- id: csharp.unsigned-security-token
  patterns:
  - pattern: RequireSignedTokens = false
  - pattern-inside: "new TokenValidationParameters {\n  ...\n}\n"
  fix: RequireSignedTokens = true
  message: Accepting unsigned security tokens as valid security tokens allows an attacker to remove its signature and potentially forge an identity. As a fix, set RequireSignedTokens to be true.
  metadata:
    category: security
    technology:
    - csharp
    owasp:
    - A02:2021 - Cryptographic Failures
    cwe:
    - 'CWE-347: Improper Verification of Cryptographic Signature'
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control/
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
    - https://cwe.mitre.org/data/definitions/347
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/cryptography/unsigned-security-token.yaml
      upstream-id: unsigned-security-token
  languages:
  - csharp
  severity: ERROR
- id: csharp.use_deprecated_cipher_algorithm
  message: Usage of deprecated cipher algorithm detected. Use Aes or ChaCha20Poly1305 instead.
  severity: ERROR
  metadata:
    likelihood: HIGH
    impact: MEDIUM
    confidence: MEDIUM
    category: security
    cwe:
    - 'CWE-327: Use of a Broken or Risky Cryptographic Algorithm'
    owasp:
    - A02:2021 - Cryptographic Failures
    references:
    - https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.des?view=net-6.0#remarks
    - https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.rc2?view=net-6.0#remarks
    - https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.aes?view=net-6.0
    - https://learn.microsoft.com/en-gb/dotnet/api/system.security.cryptography.chacha20poly1305?view=net-6.0
    subcategory:
    - vuln
    technology:
    - .net
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/dotnet/security/use_deprecated_cipher_algorithm.yaml
      upstream-id: use_deprecated_cipher_algorithm
  languages:
  - csharp
  patterns:
  - pattern: $KEYTYPE.Create(...);
  - metavariable-pattern:
      metavariable: $KEYTYPE
      pattern-either:
      - pattern: DES
      - pattern: RC2
- id: csharp.use_weak_rng_for_keygeneration
  message: You are using an insecure random number generator (RNG) to create a cryptographic key. System.Random must never be used for cryptographic purposes. Use System.Security.Cryptography.RandomNumberGenerator instead.
  severity: ERROR
  metadata:
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    category: security
    cwe:
    - 'CWE-338: Use of Cryptographically Weak Pseudo-Random Number Generator (PRNG)'
    owasp:
    - A02:2021 - Cryptographic Failures
    references:
    - https://learn.microsoft.com/en-us/dotnet/api/system.random?view=net-6.0#remarks
    - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.randomnumbergenerator?view=net-6.0
    - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.aesgcm?view=net-6.0#constructors
    - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.symmetricalgorithm.key?view=net-6.0#system-security-cryptography-symmetricalgorithm-key
    subcategory:
    - vuln
    technology:
    - .net
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/dotnet/security/use_weak_rng_for_keygeneration.yaml
      upstream-id: use_weak_rng_for_keygeneration
  languages:
  - csharp
  mode: taint
  pattern-sources:
  - patterns:
    - pattern-inside: (System.Random $RNG).NextBytes($KEY); ...
    - pattern: $KEY
  pattern-sinks:
  - pattern-either:
    - patterns:
      - pattern: ($KEYTYPE $CIPHER).Key = $SINK;
      - focus-metavariable: $SINK
      - metavariable-pattern:
          metavariable: $KEYTYPE
          pattern-either:
          - pattern: SymmetricAlgorithm
          - pattern: Aes
          - pattern: Rijndael
          - pattern: DES
          - pattern: TripleDES
          - pattern: RC2
    - pattern: new AesGcm(...)
    - pattern: new AesCcm(...)
    - pattern: new ChaCha20Poly1305(...)
