    - pattern: XPathExpression $EXPR = $NAV.Compile("..." + $INPUT + "...");
    - pattern: var $EXPR = $NAV.Compile("..." + $INPUT + "...");
    - pattern: XPathNodeIterator $NODE = $NAV.Select("..." + $INPUT + "...");
    - pattern: var $NODE = $NAV.Select("..." + $INPUT + "...");
    - pattern: Object $OBJ = $NAV.Evaluate("..." + $INPUT + "...");
    - pattern: var $OBJ = $NAV.Evaluate("..." + $INPUT + "...");
- id: csharp.X509-subject-name-validation
  severity: WARNING
  languages:
  - csharp
  metadata:
    cwe:
    - 'CWE-295: Improper Certificate Validation'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A07:2021 - Identification and Authentication Failures
    references:
    - https://docs.microsoft.com/en-us/dotnet/api/system.identitymodel.tokens.issuernameregistry?view=netframework-4.8
    category: security
    technology:
    - .net
    confidence: MEDIUM
    subcategory:
    - vuln
    likelihood: LOW
    impact: LOW
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/cryptography/X509-subject-name-validation.yaml
      upstream-id: X509-subject-name-validation
  message: Validating certificates based on subject name is bad practice. Use the X509Certificate2.Verify() method instead.
  patterns:
  - pattern-inside: 'using System.IdentityModel.Tokens;

      ...

      '
  - pattern-either:
    - patterns:
      - pattern-either:
        - pattern-inside: 'X509SecurityToken $TOK = $RHS;

            ...

            '
        - pattern-inside: "$T $M(..., X509SecurityToken $TOK, ...) {\n    ...\n}\n"
      - metavariable-pattern:
          metavariable: $RHS
          pattern-either:
          - pattern: $T as X509SecurityToken
          - pattern: new X509SecurityToken(...)
    - patterns:
      - pattern-either:
        - pattern-inside: 'X509Certificate2 $CERT = new X509Certificate2(...);

            ...

            '
        - pattern-inside: "$T $M(..., X509Certificate2 $CERT, ...) {\n    ...\n}\n"
        - pattern-inside: "foreach (X509Certificate2 $CERT in $COLLECTION) {\n    ...\n}\n"
  - patterns:
    - pattern-either:
      - pattern: String.Equals($NAME, "...")
      - pattern: String.Equals("...", $NAME)
      - pattern: $NAME.Equals("...")
      - pattern: $NAME == "..."
      - pattern: $NAME != "..."
      - pattern: '"..." == $NAME

          '
      - pattern: '"..." != $NAME

          '
    - metavariable-pattern:
        metavariable: $NAME
        pattern-either:
        - pattern: $TOK.Certificate.SubjectName.Name
        - pattern: $CERT.SubjectName.Name
        - pattern: $CERT.GetNameInfo(...)
- id: csharp.insecure-newtonsoft-deserialization
  patterns:
  - pattern-either:
    - pattern: TypeNameHandling = TypeNameHandling.$TYPEHANDLER
    - pattern: '$SETTINGS.TypeNameHandling = TypeNameHandling.$TYPEHANDLER;

        ...

        JsonConvert.DeserializeObject<$TYPE>(...,$SETTINGS);

        '
    - pattern: '$SETTINGS.TypeNameHandling = TypeNameHandling.$TYPEHANDLER;

        ...

        JsonConvert.DeserializeObject(...,$SETTINGS);

        '
  - pattern-inside: 'using Newtonsoft.Json;

      ...

      '
  - metavariable-regex:
      metavariable: $TYPEHANDLER
      regex: (All|Auto|Objects|Arrays)
  message: TypeNameHandling $TYPEHANDLER is unsafe and can lead to arbitrary code execution in the context of the process. Use a custom SerializationBinder whenever using a setting other than TypeNameHandling.None.
  languages:
  - csharp
  severity: WARNING
  metadata:
    category: security
    cwe:
    - 'CWE-502: Deserialization of Untrusted Data'
    owasp:
    - A08:2017 - Insecure Deserialization
    - A08:2021 - Software and Data Integrity Failures
    references:
    - https://www.newtonsoft.com/json/help/html/T_Newtonsoft_Json_TypeNameHandling.htm#remarks
    technology:
    - .net
    - newtonsoft
    - json
    confidence: LOW
    cwe2022-top25: true
    cwe2021-top25: true
    subcategory:
    - audit
    likelihood: LOW
    impact: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/insecure-deserialization/newtonsoft.yaml
      upstream-id: insecure-newtonsoft-deserialization
- id: csharp.jwt-tokenvalidationparameters-no-expiry-validation
  patterns:
  - pattern-either:
    - patterns:
      - pattern: $LIFETIME = $FALSE
      - pattern-inside: new TokenValidationParameters {...}
    - patterns:
      - pattern: '(TokenValidationParameters $OPTS). ... .$LIFETIME = $FALSE

          '
  - metavariable-regex:
      metavariable: $LIFETIME
      regex: (RequireExpirationTime|ValidateLifetime)
  - metavariable-regex:
      metavariable: $FALSE
      regex: (false)
  - focus-metavariable: $FALSE
  fix: 'true

    '
  message: The TokenValidationParameters.$LIFETIME is set to $FALSE, this means the JWT tokens lifetime is not validated. This can lead to an JWT token being used after it has expired, which has security implications. It is recommended to validate the JWT lifetime to ensure only valid tokens are used.
  metadata:
    category: security
    technology:
    - csharp
    owasp:
    - A02:2017 - Broken Authentication
    - A07:2021 - Identification and Authentication Failures
    cwe:
    - 'CWE-613: Insufficient Session Expiration'
    references:
    - https://owasp.org/Top10/A07_2021-Identification_and_Authentication_Failures/
    - https://cwe.mitre.org/data/definitions/613.html
    - https://docs.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.tokenvalidationparameters?view=azure-dotnet
    subcategory:
    - audit
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    opengrep-studio:
      source: opengrep-rules
      upstream-path: csharp/lang/security/ad/jwt-tokenvalidationparameters-no-expiry-validation.yaml
      upstream-id: jwt-tokenvalidationparameters-no-expiry-validation
  languages:
  - csharp
  severity: WARNING
