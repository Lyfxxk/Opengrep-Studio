  - pattern-not-inside: "return [\n  ...,\n  'lifetime' => env(\"$VAR\", $DEFAULT),\n  ...\n];\n"
  - metavariable-comparison:
      metavariable: $TIME
      comparison: $TIME > 30
  paths:
    include:
    - '*session.php'
  message: Found a configuration file where the lifetime attribute is over 30 minutes.
  languages:
  - php
  severity: ERROR
